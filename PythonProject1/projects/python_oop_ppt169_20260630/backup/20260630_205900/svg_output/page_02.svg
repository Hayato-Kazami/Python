<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1A1A2E"/>
  <!-- Title -->
  <text x="50" y="60" font-family="Arial Black" font-size="34" fill="#FFFFFF" font-weight="bold">编程思想：过程 vs 对象</text>
  <text x="50" y="95" font-family="Calibri Light" font-size="15" fill="#B0B0C0">三大编程思想之二 — 打扫教室，谁来干？怎么干？</text>

  <!-- LEFT: 面向过程 -->
  <rect x="50" y="130" width="560" height="520" rx="8" fill="#252540"/>
  <rect x="50" y="130" width="560" height="5" fill="#FF6D00"/>
  <text x="80" y="170" font-family="Arial Black" font-size="24" fill="#FF6D00">面向过程</text>
  <text x="80" y="200" font-family="Calibri Light" font-size="14" fill="#B0B0C0">我自己想 · 我自己干</text>
  <!-- Person icon -->
  <circle cx="330" cy="330" r="50" fill="#FF6D00" opacity="0.15"/>
  <text x="330" y="342" text-anchor="middle" font-family="Calibri" font-size="36" fill="#FF6D00">🧑</text>
  <text x="330" y="400" text-anchor="middle" font-family="Calibri" font-size="14" fill="#B0B0C0">我</text>
  <!-- 3 action boxes -->
  <rect x="120" y="430" width="130" height="50" rx="6" fill="#1A1A2E"/>
  <text x="185" y="461" text-anchor="middle" font-family="Calibri" font-size="15" fill="#B0B0C0">🧹 扫地</text>
  <rect x="265" y="430" width="130" height="50" rx="6" fill="#1A1A2E"/>
  <text x="330" y="461" text-anchor="middle" font-family="Calibri" font-size="15" fill="#B0B0C0">🧹 拖地</text>
  <rect x="410" y="430" width="130" height="50" rx="6" fill="#1A1A2E"/>
  <text x="475" y="461" text-anchor="middle" font-family="Calibri" font-size="15" fill="#B0B0C0">🧽 擦桌子</text>
  <text x="330" y="530" text-anchor="middle" font-family="Calibri Light" font-size="13" fill="#666680">脑袋怎么想 → 代码就怎么写</text>
  <text x="330" y="580" text-anchor="middle" font-family="Calibri Light" font-size="13" fill="#FF6D00" font-style="italic">每一步都要自己来</text>

  <!-- Center VS -->
  <circle cx="640" cy="390" r="40" fill="#00BFA5"/>
  <text x="640" y="398" text-anchor="middle" font-family="Arial Black" font-size="20" fill="#FFFFFF">VS</text>

  <!-- RIGHT: 面向对象 -->
  <rect x="670" y="130" width="560" height="520" rx="8" fill="#252540"/>
  <rect x="670" y="130" width="560" height="5" fill="#00BFA5"/>
  <text x="700" y="170" font-family="Arial Black" font-size="24" fill="#00BFA5">面向对象</text>
  <text x="700" y="200" font-family="Calibri Light" font-size="14" fill="#B0B0C0">培养对象 · 让对象干</text>
  <!-- Flow: me → 胖虎 → done -->
  <circle cx="800" cy="310" r="40" fill="#00BFA5" opacity="0.15"/>
  <text x="800" y="322" text-anchor="middle" font-family="Calibri" font-size="28" fill="#B0B0C0">🙋</text>
  <text x="800" y="370" text-anchor="middle" font-family="Calibri" font-size="14" fill="#B0B0C0">我</text>
  <text x="860" y="322" text-anchor="middle" font-family="Calibri" font-size="24" fill="#00BFA5">→</text>
  <circle cx="930" cy="310" r="45" fill="#00BFA5" opacity="0.2"/>
  <text x="930" y="325" text-anchor="middle" font-family="Calibri" font-size="32" fill="#00BFA5">⚙️</text>
  <text x="930" y="370" text-anchor="middle" font-family="Calibri" font-size="16" fill="#00BFA5" font-weight="bold">胖虎</text>
  <text x="1000" y="322" text-anchor="middle" font-family="Calibri" font-size="24" fill="#00BFA5">→</text>
  <circle cx="1070" cy="310" r="40" fill="#00BFA5" opacity="0.15"/>
  <text x="1070" y="322" text-anchor="middle" font-family="Calibri" font-size="28" fill="#00BFA5">✅</text>
  <text x="1070" y="370" text-anchor="middle" font-family="Calibri" font-size="14" fill="#B0B0C0">搞定</text>
  <!-- Bottom note -->
  <text x="950" y="460" text-anchor="middle" font-family="Calibri Light" font-size="14" fill="#B0B0C0">找合适的对象 → 让它干活</text>
  <text x="950" y="490" text-anchor="middle" font-family="Calibri Light" font-size="14" fill="#B0B0C0">不关心它怎么干</text>
  <text x="950" y="550" text-anchor="middle" font-family="Calibri Light" font-size="14" fill="#00BFA5" font-style="italic">胖虎怎么打扫是它的事，我只要结果</text>

  <!-- Footer -->
  <text x="50" y="695" font-family="Calibri Light" font-size="11" fill="#666680">编程思想  |  面向过程 = 自己干  |  面向对象 = 找对象干</text>
</svg>

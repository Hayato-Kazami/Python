<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1A1A2E"/>
  <!-- Title -->
  <text x="50" y="60" font-family="Arial Black" font-size="34" fill="#FFFFFF" font-weight="bold">四个核心魔法方法</text>
  <text x="50" y="95" font-family="Calibri Light" font-size="15" fill="#B0B0C0">特定名字 → 特定功能 → Python 自动调用</text>

  <!-- 2x2 Grid -->
  <!-- __init__ -->
  <g transform="translate(50,130)">
    <rect x="0" y="0" width="575" height="255" rx="8" fill="#252540"/>
    <circle cx="40" cy="40" r="28" fill="#00BFA5"/>
    <text x="40" y="50" text-anchor="middle" font-family="Calibri" font-size="22" fill="#FFFFFF">✨</text>
    <text x="85" y="38" font-family="Consolas" font-size="20" fill="#00BFA5" font-weight="bold">__init__</text>
    <text x="85" y="58" font-family="Calibri" font-size="14" fill="#FFFFFF">构造方法</text>
    <text x="20" y="100" font-family="Calibri Light" font-size="13" fill="#B0B0C0">创建对象时自动执行，传参自动传入</text>
    <text x="20" y="122" font-family="Calibri Light" font-size="13" fill="#B0B0C0">self.name = name → 完成属性赋值</text>
    <text x="20" y="144" font-family="Calibri Light" font-size="13" fill="#B0B0C0">对象「出生」即属性齐全</text>
    <rect x="0" y="220" width="575" height="35" rx="0" fill="#00BFA5" opacity="0.12"/>
    <text x="287" y="243" text-anchor="middle" font-family="Consolas" font-size="12" fill="#00BFA5">Dog("阿黄","黄") → __init__ 自动调用</text>
  </g>

  <!-- __str__ -->
  <g transform="translate(655,130)">
    <rect x="0" y="0" width="575" height="255" rx="8" fill="#252540"/>
    <circle cx="40" cy="40" r="28" fill="#448AFF"/>
    <text x="40" y="50" text-anchor="middle" font-family="Calibri" font-size="22" fill="#FFFFFF">🔍</text>
    <text x="85" y="38" font-family="Consolas" font-size="20" fill="#448AFF" font-weight="bold">__str__</text>
    <text x="85" y="58" font-family="Calibri" font-size="14" fill="#FFFFFF">字符串方法</text>
    <text x="20" y="100" font-family="Calibri Light" font-size="13" fill="#B0B0C0">print() / str() 时自动调用</text>
    <text x="20" y="122" font-family="Calibri Light" font-size="13" fill="#B0B0C0">返回可读字符串，替代内存地址</text>
    <text x="20" y="144" font-family="Calibri Light" font-size="13" fill="#B0B0C0">return f"我是{self.name}"</text>
    <rect x="0" y="220" width="575" height="35" rx="0" fill="#448AFF" opacity="0.12"/>
    <text x="287" y="243" text-anchor="middle" font-family="Consolas" font-size="12" fill="#448AFF">print(dog) → __str__ 自动调用</text>
  </g>

  <!-- __eq__ -->
  <g transform="translate(50,415)">
    <rect x="0" y="0" width="575" height="255" rx="8" fill="#252540"/>
    <circle cx="40" cy="40" r="28" fill="#FF6D00"/>
    <text x="40" y="50" text-anchor="middle" font-family="Calibri" font-size="22" fill="#FFFFFF">⚖️</text>
    <text x="85" y="38" font-family="Consolas" font-size="20" fill="#FF6D00" font-weight="bold">__eq__</text>
    <text x="85" y="58" font-family="Calibri" font-size="14" fill="#FFFFFF">相等比较</text>
    <text x="20" y="100" font-family="Calibri Light" font-size="13" fill="#B0B0C0">== 比较时自动调用，应返回 True/False</text>
    <text x="20" y="122" font-family="Calibri Light" font-size="13" fill="#B0B0C0">自定义相等逻辑，而非比较内存地址</text>
    <text x="20" y="144" font-family="Calibri Light" font-size="13" fill="#B0B0C0">def __eq__(self, other): 比较属性</text>
    <rect x="0" y="220" width="575" height="35" rx="0" fill="#FF6D00" opacity="0.12"/>
    <text x="287" y="243" text-anchor="middle" font-family="Consolas" font-size="12" fill="#FF6D00">dog1 == dog2 → __eq__ 自动调用</text>
  </g>

  <!-- __del__ -->
  <g transform="translate(655,415)">
    <rect x="0" y="0" width="575" height="255" rx="8" fill="#252540"/>
    <circle cx="40" cy="40" r="28" fill="#FF5252"/>
    <text x="40" y="50" text-anchor="middle" font-family="Calibri" font-size="22" fill="#FFFFFF">🗑️</text>
    <text x="85" y="38" font-family="Consolas" font-size="20" fill="#FF5252" font-weight="bold">__del__</text>
    <text x="85" y="58" font-family="Calibri" font-size="14" fill="#FFFFFF">析构方法</text>
    <text x="20" y="100" font-family="Calibri Light" font-size="13" fill="#B0B0C0">对象被删除时自动执行</text>
    <text x="20" y="122" font-family="Calibri Light" font-size="13" fill="#B0B0C0">清理资源（关文件等）/ del 或程序退出触发</text>
    <text x="20" y="144" font-family="Calibri Light" font-size="13" fill="#B0B0C0">def __del__(self): 收尾工作</text>
    <rect x="0" y="220" width="575" height="35" rx="0" fill="#FF5252" opacity="0.12"/>
    <text x="287" y="243" text-anchor="middle" font-family="Consolas" font-size="12" fill="#FF5252">del dog / 程序退出 → __del__ 自动调用</text>
  </g>

  <!-- Footer -->
  <text x="50" y="695" font-family="Calibri Light" font-size="11" fill="#666680">魔法方法 = 特定名字 + 特定功能  |  写了就有，不写用默认</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1A1A2E" />
  
  <text x="50" y="60" font-family="Arial Black" font-size="34" fill="#FFFFFF" font-weight="bold">self 是什么？</text>
  <text x="50" y="95" font-family="Calibri Light" font-size="15" fill="#B0B0C0">哪个对象调用，self 就是谁 — 同一个方法，不同数据</text>

  
  <circle cx="180" cy="300" r="70" fill="#448AFF" opacity="0.12" />
  <circle cx="180" cy="300" r="55" fill="#448AFF" opacity="0.2" />
  <text x="180" y="315" text-anchor="middle" font-family="Calibri" font-size="36" fill="#FFFFFF">👤</text>
  <text x="180" y="390" text-anchor="middle" font-family="Arial Black" font-size="18" fill="#FFFFFF">stu1</text>
  <text x="180" y="415" text-anchor="middle" font-family="Calibri Light" font-size="15" fill="#B0B0C0">王丽红</text>

  
  <path fill="#252540" d="M488,220 H792 A8,8 0 0 1 800,228 V372 A8,8 0 0 1 792,380 H488 A8,8 0 0 1 480,372 V228 A8,8 0 0 1 488,220 Z" />
  <rect x="480" y="220" width="320" height="4" fill="#00BFA5" />
  <text x="500" y="255" font-family="Consolas" font-size="18" fill="#00BFA5" font-weight="bold">def sleep(self):</text>
  <text x="520" y="285" font-family="Consolas" font-size="16" fill="#B0B0C0">print(f"大家好，</text>
  <text x="520" y="310" font-family="Consolas" font-size="16" fill="#B0B0C0">  我是{self.name}")</text>
  <text x="500" y="350" font-family="Calibri Light" font-size="13" fill="#00BFA5" font-style="italic">self = 调用者本身</text>

  
  <circle cx="1100" cy="300" r="70" fill="#FF6D00" opacity="0.12" />
  <circle cx="1100" cy="300" r="55" fill="#FF6D00" opacity="0.2" />
  <text x="1100" y="315" text-anchor="middle" font-family="Calibri" font-size="36" fill="#FFFFFF">👤</text>
  <text x="1100" y="390" text-anchor="middle" font-family="Arial Black" font-size="18" fill="#FFFFFF">stu2</text>
  <text x="1100" y="415" text-anchor="middle" font-family="Calibri Light" font-size="15" fill="#B0B0C0">周杰轮</text>

  
  <text x="370" y="305" font-family="Calibri" font-size="20" fill="#448AFF">调用 →</text>
  <text x="810" y="305" font-family="Calibri" font-size="20" fill="#FF6D00">← 调用</text>

  
  <path fill="#448AFF" opacity="0.15" d="M136,470 H574 A6,6 0 0 1 580,476 V519 A6,6 0 0 1 574,525 H136 A6,6 0 0 1 130,519 V476 A6,6 0 0 1 136,470 Z" />
  <text x="355" y="504" text-anchor="middle" font-family="Consolas" font-size="15" fill="#FFFFFF">→ 输出：大家好，我是王丽红</text>

  <path fill="#FF6D00" opacity="0.15" d="M706,470 H1144 A6,6 0 0 1 1150,476 V519 A6,6 0 0 1 1144,525 H706 A6,6 0 0 1 700,519 V476 A6,6 0 0 1 706,470 Z" />
  <text x="925" y="504" text-anchor="middle" font-family="Consolas" font-size="15" fill="#FFFFFF">→ 输出：大家好，我是周杰轮</text>

  
  <path fill="#00BFA5" opacity="0.1" d="M206,570 H1074 A6,6 0 0 1 1080,576 V614 A6,6 0 0 1 1074,620 H206 A6,6 0 0 1 200,614 V576 A6,6 0 0 1 206,570 Z" />
  <text x="640" y="602" text-anchor="middle" font-family="Calibri Light" font-size="16" fill="#00BFA5">同一个方法 sleep(self)，不同对象调用，self 指向不同 → 输出不同</text>

  
  <text x="50" y="695" font-family="Calibri Light" font-size="11" fill="#666680">理解 self = 理解面向对象  |  方法签名中的第一参数就是实例本身</text>
</svg>